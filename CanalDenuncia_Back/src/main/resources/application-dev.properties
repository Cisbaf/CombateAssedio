# JWT Configurations
jwt.secret=${JWT_SECRET:Y2lzYmFmLWNvYW1iYXRlLWFzZWRpby1zZWNyZXQta2V5LTMyLWJ5dGVzLWxvbmc=}
jwt.expiration=${JWT_EXPIRATION:86400}
jwt.httponly=${JWT_HTTPONLY:true}
jwt.secure=${JWT_SECURE:false}

# Limite de tamanho por arquivo (padrão Spring é 1MB — aumente se necessário)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Pasta onde os arquivos ficam dentro do container
upload.dir=/uploads

# URL base para montar a URL pública dos arquivos
app.base-url=http://localhost:8080

# Chave AES-256 para criptografia do CPF (exatamente 32 caracteres)
# Em produção, substitua por uma variável de ambiente segura: ${CPF_ENCRYPTION_KEY}
cpf.encryption.key=${CPF_ENCRYPTION_KEY:cisbaf-cpf-key-32bytes-secure!!!}