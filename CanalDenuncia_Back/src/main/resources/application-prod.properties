spring.jpa.show-sql=false
spring.devtools.restart.enabled=false
spring.jpa.hibernate.ddl-auto=update

# JWT Configurations
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400}
jwt.httponly=${JWT_HTTPONLY:true}
jwt.secure=${JWT_SECURE:true}

# Limite de tamanho por arquivo (padrão Spring é 1MB — aumente se necessário)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Pasta onde os arquivos ficam dentro do container
upload.dir=/uploads

# URL base para montar a URL pública dos arquivos (pode ser sobrescrita via .env)
app.base-url=${APP_BASE_URL:http://localhost:8080}