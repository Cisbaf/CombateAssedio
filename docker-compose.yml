services:
  mysql:
    image: mysql:8.0
    container_name: canal-denuncias-db
    ports:
      - "3306:3306"
    env_file:
      - .env
    environment:
      - MYSQL_ROOT_HOST=%
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - canalDenuncia-network
    volumes:
      - canal-denuncias-db-data:/var/lib/mysql

  backend:
    build:
      context: ./CanalDenuncia_Back
      dockerfile: Dockerfile
    container_name: canal-denuncias-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DB_URL=jdbc:mysql://mysql:3306/canal_denuncias
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - canalDenuncia-network
    develop:
      watch:
        - action: sync+restart
          path: ./CanalDenuncia_Back/src
          target: /app/src
        - action: rebuild
          path: ./CanalDenuncia_Back/pom.xml
    volumes:
      - ./uploads:/uploads

  frontend:
    build:
      context: ./CanalDenuncia_Front
      dockerfile: Dockerfile
    container_name: canal-denuncias-frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - canalDenuncia-network
    develop:
      watch:
        - action: sync
          path: ./CanalDenuncia_Front/src
          target: /app/src
        - action: sync
          path: ./CanalDenuncia_Front/public
          target: /app/public
        - action: sync+restart
          path: ./CanalDenuncia_Front/next.config.ts
          target: /app/next.config.ts
        - action: rebuild
          path: ./CanalDenuncia_Front/package.json

volumes:
  canal-denuncias-db-data:

networks:
  canalDenuncia-network:
    driver: bridge
