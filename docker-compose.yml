services:
  mysql:
    image: mysql:8.0
    container_name: canal-denuncias-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: canal_denuncias
    volumes:
      - canal-denuncias-db-data:/var/lib/mysql

  backend:
    build:
      context: ./CanalDenuncia_Back
      dockerfile: Dockerfile
    container_name: canal-denuncias-backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=mysql
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:
      - mysql
      
  frontend:
    build:
      context: ./CanalDenuncia_Front
      dockerfile: Dockerfile
    container_name: canal-denuncias-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  canal-denuncias-db-data:


